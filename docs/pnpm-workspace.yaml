# Marks docs as its own pnpm project so the settings file at the repository
# root does not capture this install.
#
# None of these need their install script - each ships its native binary as a
# platform-specific optional dependency. pnpm 11 spells the setting
# `allowBuilds`, pnpm 10 spells it `ignoredBuiltDependencies`; both are listed
# so either version installs without failing on ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@tailwindcss/oxide": false
  esbuild: false
  sharp: false

ignoredBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
