# pnpm >= 11 no longer reads the "pnpm" field in package.json; these settings
# live here instead. pnpm 10.16+ reads them from here too, so both work.
overrides:
  micromatch@<4.0.8: '>=4.0.8'

# Dependencies that ship an install script have to be accounted for or pnpm 11
# fails the install with ERR_PNPM_IGNORED_BUILDS. pnpm 11 spells this
# `allowBuilds`; pnpm 10 spells it onlyBuiltDependencies/ignoredBuiltDependencies,
# so both are listed and either version installs without prompting.
#
# Only lefthook needs its script, to sync the git hooks. The rest ship their
# native binaries as platform-specific optional dependencies.
allowBuilds:
  "@biomejs/biome": false
  "@swc/core": false
  esbuild: false
  lefthook: true

onlyBuiltDependencies:
  - lefthook

ignoredBuiltDependencies:
  - "@biomejs/biome"
  - "@swc/core"
  - esbuild
